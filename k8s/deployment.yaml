###############################################################################
# Kubernetes Deployment — Santander ML Pipeline API
#
# Mantém 3 réplicas (mínimo do HPA) com probes de saúde e limites de recursos.
# Env vars injetadas via ConfigMap (santander-ml-config) e Secret
# (santander-ml-secrets) — nenhum valor sensível em texto plano.
#
# Hardening (P2):
#   - PoC usa :latest (tag publicada pelo CI). Em produção, pinar a tag
#     imutável :${github.sha} (também publicada pelo CI) — ver README §3.10.
#   - securityContext: runAsNonRoot, readOnlyRootFilesystem, drop ALL caps
#   - emptyDir para /tmp e /app/data/logs (única gravação em runtime)
#
# Dependências (aplicar antes):
#   kubectl apply -f k8s/configmap-secret.yaml
#   kubectl apply -f k8s/deployment.yaml
#   kubectl apply -f k8s/service.yaml
#   kubectl apply -f k8s/hpa.yaml
#   kubectl apply -f k8s/networkpolicy.yaml
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: santander-ml-api
  labels:
    app: santander-ml-api
    tier: backend
    project: santander-ml-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: santander-ml-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: santander-ml-api
        tier: backend
    spec:
      # ---------------------------------------------------------------
      # securityContext em nível de Pod — defaults seguros que aplicam
      # a todos os containers do pod.
      # ---------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ml-api
          # PoC: :latest é a tag que o CI publica no GHCR (ci.yml).
          # Produção: substituir por :${github.sha} (tag imutável também
          # publicada pelo CI) via `kubectl set image` — ver README §3.10.
          image: ghcr.io/arthurs357/santander-ml-pipeline/pima-diabetes-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http

          # ---------------------------------------------------------------
          # securityContext em nível de container — overrides do pod.
          # ---------------------------------------------------------------
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ---------------------------------------------------------------
          # Variáveis de ambiente — injetadas via ConfigMap e Secret
          # ---------------------------------------------------------------

          # Bulk inject: todas as chaves do ConfigMap viram env vars
          envFrom:
            - configMapRef:
                name: santander-ml-config

          # Variáveis sensíveis: referência explícita ao Secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: santander-ml-secrets
                  key: DATABASE_URL
            # Token de admin para /admin/reload_model — Secret externo
            - name: ADMIN_RELOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: santander-ml-secrets
                  key: ADMIN_RELOAD_TOKEN
                  optional: true

          # ---------------------------------------------------------------
          # Volumes graváveis exigidos pelo readOnlyRootFilesystem=true.
          # Tudo é efêmero (emptyDir) — pods sem estado.
          # ---------------------------------------------------------------
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: inference-logs
              mountPath: /app/data/logs

          # ---------------------------------------------------------------
          # Recursos (requests / limits)
          # ---------------------------------------------------------------
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # ---------------------------------------------------------------
          # Probes de saúde
          # ---------------------------------------------------------------
          # Readiness: bloqueia tráfego enquanto o modelo não estiver carregado (503)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness: reinicia o container apenas se o processo deixar de responder
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      # ---------------------------------------------------------------
      # Volumes efêmeros (recriados a cada start do pod).
      # ---------------------------------------------------------------
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: inference-logs
          emptyDir:
            sizeLimit: 256Mi

      # Restart policy padrão para Deployments
      restartPolicy: Always
