###############################################################################
# Secret (Opaque) — EXEMPLO / PLACEHOLDER — NÃO aplicar em produção
#
# Este arquivo existe apenas para DOCUMENTAR as chaves esperadas pelo
# Deployment (secretRef: santander-ml-secrets). Os valores são placeholders.
#
# Em produção, crie o Secret imperativamente (fora do Git):
#
#   kubectl create secret generic santander-ml-secrets \
#     --namespace santander-ml \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/DBNAME' \
#     --from-literal=ADMIN_RELOAD_TOKEN="$(openssl rand -base64 32)"
#
# Ou use Sealed Secrets, External Secrets Operator ou um vault
# (HashiCorp Vault, AWS Secrets Manager) — nunca Secrets versionados em Git.
#
# stringData aceita texto plano (o Kubernetes codifica em base64 ao aplicar),
# evitando o anti-padrão de commitar valores base64 que parecem segredos reais.
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: santander-ml-secrets
  namespace: santander-ml
  labels:
    app: santander-ml-api
    project: santander-ml-pipeline
type: Opaque
stringData:
  # PLACEHOLDER — substitua via `kubectl create secret` (ver acima).
  DATABASE_URL: "postgresql://{USER}:{PASSWORD}@{HOST}:5432/{DBNAME}"

  # PLACEHOLDER — token administrativo para /admin/reload_model.
  # Se vazio/ausente, o endpoint nega acesso por padrão (fail-secure).
  # Gerar: openssl rand -base64 32
  # checkov:skip=CKV_SECRET_4: "Placeholder secret"
  ADMIN_RELOAD_TOKEN: "CHANGE_ME"
