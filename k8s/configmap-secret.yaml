###############################################################################
# ConfigMap & Secret — Santander ML Pipeline
#
# ConfigMap: variáveis NÃO sensíveis (configuração de aplicação).
# Secret:    variáveis SENSÍVEIS (credenciais, connection strings).
#
# Aplicar:
#   kubectl apply -f k8s/configmap-secret.yaml
#
# IMPORTANTE: Em produção, utilize Sealed Secrets, External Secrets Operator
# ou um vault (HashiCorp Vault, AWS Secrets Manager) em vez de Secrets
# versionados em Git.
###############################################################################

---
# =========================================================================
# ConfigMap — Variáveis de configuração não sensíveis
# =========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: santander-ml-config
  labels:
    app: santander-ml-api
    project: santander-ml-pipeline
data:
  # MLflow Tracking Server
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"

  # URI do modelo registrado no MLflow Registry.
  # Nome único e estável: PimaDiabetesClassifier (algoritmo vencedor fica como param do run).
  # Alias @champion = modelo aprovado para produção (governança do train.py):
  # promover um modelo é mover o alias no Registry — sem redeploy.
  MODEL_URI: "models:/PimaDiabetesClassifier@champion"

  # Caminho dos dados processados (referência para Data Drift Report)
  PROCESSED_DATA_FILE: "data/processed/pima_diabetes_processed.csv"

  # Caminho do log de inferências (gravado pela API, lido pelo Report)
  INFERENCE_LOG_FILE: "data/logs/inference_logs.csv"

  # Threshold de drift para disparo de alertas (0.0 – 1.0)
  DRIFT_THRESHOLD: "0.5"

---
# =========================================================================
# Secret (Opaque) — Variáveis sensíveis
# =========================================================================
# NÃO versione segredos reais aqui. Este manifesto contém apenas
# PLACEHOLDERS (stringData) para documentar as chaves esperadas.
#
# Em produção, crie o Secret imperativamente (fora do Git) e remova/ignore
# este bloco — ou use Sealed Secrets / External Secrets Operator / Vault:
#
#   kubectl create secret generic santander-ml-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/DBNAME' \
#     --from-literal=ADMIN_RELOAD_TOKEN="$(openssl rand -base64 32)"
#
# stringData aceita texto plano (o Kubernetes codifica em base64 ao aplicar),
# evitando o anti-padrão de commitar valores base64 que parecem segredos reais.
# =========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: santander-ml-secrets
  labels:
    app: santander-ml-api
    project: santander-ml-pipeline
type: Opaque
stringData:
  # PLACEHOLDER — substitua via `kubectl create secret` (ver acima).
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DBNAME"

  # PLACEHOLDER — token administrativo para /admin/reload_model.
  # Se vazio/ausente, o endpoint nega acesso por padrão (fail-secure).
  # Gerar: openssl rand -base64 32
  ADMIN_RELOAD_TOKEN: "CHANGE_ME"
